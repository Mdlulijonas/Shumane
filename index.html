<script>
    // Global variables
    let currentMode = 'auto';
    let isOnline = navigator.onLine;
    let fullVersionLoaded = false;

    const banner = document.getElementById('modeBanner');

    // Show/hide banner and update text
    function updateBanner(mode) {
        if (mode === 'data-free') {
            banner.textContent = 'DATA-FREE MODE ACTIVE - No mobile data charges apply. Click here to switch to Full Version if you have internet.';
            banner.style.display = 'block';
            banner.setAttribute('data-mode', 'datafree');
            banner.style.background = '#2C9B77';
            banner.onclick = () => switchToConnected();
        } else {
            banner.textContent = 'FULL VERSION ACTIVE - Uses internet connection. Click here to switch to Data-Free Mode to save data.';
            banner.style.display = 'block';
            banner.setAttribute('data-mode', 'connected');
            banner.style.background = '#E67E22';
            banner.onclick = () => switchToDataFree();
        }
    }

    // Load data-free version from template
    function loadDataFreeVersion() {
        const template = document.getElementById('datafree-template');
        const clone = template.content.cloneNode(true);
        const appDiv = document.getElementById('app');
        appDiv.innerHTML = '';
        appDiv.appendChild(clone);
        fullVersionLoaded = false;
        updateBanner('data-free');
        attachDataFreeNavToggle();
        attachSmoothScroll();
    }

    // Load full version by fetching full-version.html and injecting it
    async function loadFullVersion() {
        try {
            const response = await fetch('full-version.html');
            if (!response.ok) throw new Error('Failed to load full version');
            let html = await response.text();

            // Inject the banner after the body tag (so it appears at the very top)
            // We'll add a small script to adjust body padding because the full version's navbar is fixed.
            // We'll also ensure the banner is visible by adding it right after <body>.
            const bannerHtml = `<div id="fullVersionBanner" class="mode-banner" style="display: block; background: #E67E22;">FULL VERSION ACTIVE - Uses internet connection. Click here to switch to Data-Free Mode to save data.</div>`;
            // Insert after <body> opening tag
            html = html.replace(/<body[^>]*>/i, match => match + bannerHtml);

            // Also add a script to adjust body padding and attach banner click handler
            const scriptFix = `<script>
                // Adjust body padding for the banner
                document.body.style.paddingTop = '40px';
                // Attach click handler to the banner
                const bannerElem = document.getElementById('fullVersionBanner');
                if (bannerElem) {
                    bannerElem.onclick = function() { window.dispatchEvent(new CustomEvent('switchToDataFree')); };
                }
                // Re-initialize any scripts that depend on DOM (like Swiper, AOS) after full load
                if (typeof AOS !== 'undefined') AOS.refresh();
                if (typeof Swiper !== 'undefined') {
                    new Swiper('.hero-swiper', { effect: 'fade', loop: true, autoplay: { delay: 6000 } });
                }
            <\/script>`;
            // Insert before closing </body> to ensure DOM is ready
            html = html.replace(/<\/body>/i, scriptFix + '</body>');

            // Replace the app container content
            const appDiv = document.getElementById('app');
            appDiv.innerHTML = html;

            fullVersionLoaded = true;
            updateBanner('connected'); // we already have a banner, but we need to hide our original banner? Actually we injected a separate banner, but we can still keep the original hidden. Let's hide the original one.
            document.getElementById('modeBanner').style.display = 'none';

            // We also need to listen for the custom event dispatched from the injected banner's onclick
            window.addEventListener('switchToDataFree', () => switchToDataFree());
        } catch (error) {
            console.error('Error loading full version:', error);
            // Fallback to data-free
            loadDataFreeVersion();
        }
    }

    // Load version based on connection and mode
    async function loadVersion(mode) {
        if (mode === 'data-free' || (mode === 'auto' && !isOnline)) {
            loadDataFreeVersion();
            currentMode = 'data-free';
        } else {
            await loadFullVersion();
            currentMode = 'connected';
        }
    }

    function switchToDataFree() {
        isOnline = false;
        loadVersion('data-free');
    }

    function switchToConnected() {
        isOnline = true;
        loadVersion('connected');
    }

    // Helpers for data-free version
    function attachDataFreeNavToggle() {
        const toggleBtn = document.querySelector('.datafree-nav-toggle');
        const navLinks = document.querySelector('.datafree-nav-links');
        if (toggleBtn && navLinks) {
            toggleBtn.onclick = () => navLinks.classList.toggle('show');
        }
    }

    function attachSmoothScroll() {
        document.querySelectorAll('a[href^="#"]').forEach(anchor => {
            anchor.removeEventListener('click', handleSmoothScroll);
            anchor.addEventListener('click', handleSmoothScroll);
        });
    }

    function handleSmoothScroll(e) {
        e.preventDefault();
        const targetId = this.getAttribute('href');
        if (targetId === '#') return;
        const target = document.querySelector(targetId);
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    // Listen for online/offline events
    window.addEventListener('online', () => {
        isOnline = true;
        if (currentMode !== 'connected') loadVersion('connected');
    });
    window.addEventListener('offline', () => {
        isOnline = false;
        loadVersion('data-free');
    });

    // Global functions for data-free forms
    window.submitAppointmentDF = function() {
        let name = document.getElementById('appNameDF')?.value;
        if (!name) return alert('Please fill required fields');
        window.location.href = 'mailto:info@shumaneholdings.com?cc=phistos@shumaneholdings.com&subject=Appointment from ' + encodeURIComponent(name) +
            '&body=Name: ' + encodeURIComponent(name) + '%0AEmail: ' + encodeURIComponent(document.getElementById('appEmailDF').value) +
            '%0ADate: ' + encodeURIComponent(document.getElementById('appDateDF').value);
    };
    window.submitCourseDF = function() {
        let name = document.getElementById('courseNameDF')?.value;
        if (!name) return alert('Please enter your name');
        window.location.href = 'mailto:info@shumaneholdings.com?cc=phistos@shumaneholdings.com&subject=Course Application&body=Name: ' +
            encodeURIComponent(name) + '%0AEmail: ' + encodeURIComponent(document.getElementById('courseEmailDF').value) +
            '%0APhone: ' + encodeURIComponent(document.getElementById('coursePhoneDF').value) +
            '%0ACourse: ' + encodeURIComponent(document.getElementById('courseSelectDF').value);
    };

    // Initial load
    loadVersion('auto');
</script>
